name: Backend CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

env:
  PHP_VERSION: '8.4'
  PHP_EXTENSIONS: pdo_pgsql, pgsql, intl, opcache, ctype, iconv

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Uploaded as an artifact (rather than relying on cache alone) so lint/test
      # deterministically get exactly what build produced, not a best-effort cache hit.
      - name: Upload vendor artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor
          path: vendor
          retention-days: 1
          include-hidden-files: true

  lint:
    name: Lint
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Download vendor artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor

      - name: PHP syntax lint
        run: vendor/bin/parallel-lint src tests

      - name: PHPCS (PSR-12)
        run: vendor/bin/phpcs

      - name: Psalm static analysis
        run: vendor/bin/psalm --no-progress --output-format=github

  test:
    name: Test
    needs: [build, lint]
    runs-on: ubuntu-latest
    services:
      database:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Only DATABASE_URL needs overriding here — .env.test's committed value points
      # at the dev docker-compose hostname (database:8432), which doesn't exist in CI.
      # Everything else (APP_SECRET, JWT_*, MESSENGER_TRANSPORT_DSN) is already correct
      # via .env/.env.test as committed.
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=18&charset=utf8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download vendor artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor

      # config/jwt/*.pem is gitignored — Lexik needs real key files to exist even
      # though JWT_PASSPHRASE is blank in this project.
      - name: Generate JWT keypair
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists

      # dbname_suffix ('_test') in config/packages/doctrine.yaml means the real test
      # database is app_test, not the service container's default "app" database.
      - name: Create test database
        run: php bin/console doctrine:database:create --env=test --if-not-exists

      - name: Run migrations
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction

      # video_transcript_embeds (pgvector) isn't Doctrine-managed — separate setup step.
      - name: Set up pgvector store
        run: php bin/console ai:store:setup ai.store.postgres.video_transcript_embeds --env=test

      # messenger_messages table — required even though nothing consumes it in tests.
      - name: Set up Messenger transports
        run: php bin/console messenger:setup-transports --env=test

      - name: Run test suite
        run: vendor/bin/phpunit

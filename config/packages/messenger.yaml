framework:
    messenger:
        failure_transport: failed

        transports:
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            failed: 'doctrine://default?queue_name=failed'

        routing:
            App\Message\TranscribeVideoMessage:   async
            App\Message\EmbedVideoSummaryMessage: async
            App\Message\GenerateChaptersMessage:  async
            App\Message\GenerateTagsMessage:      async
            App\Message\TranslateCaptionsMessage: async

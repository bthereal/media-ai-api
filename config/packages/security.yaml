security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        login:
            pattern: ^/api/auth/token$
            stateless: true
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/api/auth/token$, roles: PUBLIC_ACCESS }
        - { path: ^/api/content/.+/stream$, roles: PUBLIC_ACCESS }
        - { path: ^/api/content/.+/thumbnail$, roles: PUBLIC_ACCESS }
        - { path: ^/api/content/.+/thumbnail/candidates/\d+$, roles: PUBLIC_ACCESS }
        - { path: ^/api/content/.+/watch-events$, roles: PUBLIC_ACCESS }
        - { path: ^/api/content/.+/progress$, roles: PUBLIC_ACCESS }
        - { path: ^/api/content/.+/captions/.+\.vtt$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
        firewalls:
            api:
                security: false
